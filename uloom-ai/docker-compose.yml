services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://uloom:uloom@db:5432/uloom
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/srv/app/app
      - documents_data:/srv/app/data/documents

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: uloom
      POSTGRES_PASSWORD: uloom
      POSTGRES_DB: uloom
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uloom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
  documents_data:
