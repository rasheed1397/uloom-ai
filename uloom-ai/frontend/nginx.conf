server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # NFR-004: TLS only - no plaintext listener at all (see docker-compose.yml,
    # only 443 is published). nginx rejects a stray plain-http request outright
    # (400) rather than redirecting: this container's published host port
    # doesn't match its internal http port 1:1, so a same-port 80->443
    # redirect's Location header would point at the wrong host:port. A real
    # deployment on standard 80/443 doesn't have that mismatch and can redirect.

    # 1 year, matches common HSTS guidance; local self-signed cert still
    # triggers a one-time browser trust prompt, this only stops silent
    # downgrade to plain http afterward.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # React Router owns client-side routes like /documents, /conversations/:id
    # - nginx has no matching file for those, so fall back to index.html and
    # let the SPA's router handle it. Without this, a hard refresh (or
    # sharing a link) on any route but "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
