server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns client-side routes like /documents, /conversations/:id
    # - nginx has no matching file for those, so fall back to index.html and
    # let the SPA's router handle it. Without this, a hard refresh (or
    # sharing a link) on any route but "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
