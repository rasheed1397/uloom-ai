[project]
name = "uloom-ai"
version = "0.1.0"
description = "Uloom AI - modular RAG platform (v1: document intelligence)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (prefer enum.StrEnum) intentionally ignored: `str, Enum` is kept for
# broader compatibility with libraries that don't special-case StrEnum yet.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped loop: app.core.db's async engine/connection pool is created
# once at import time, so it must be used from a single event loop for the
# whole test run rather than a fresh loop per test function (the default),
# which breaks asyncpg with "another operation is in progress".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
